name: CI — Radar Jurídico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma Generate & Sync SQLite
        run: |
          npx prisma generate
          npx prisma db push

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Unit Tests (Vitest)
        run: npm test

      - name: Production Build
        run: npm run build
